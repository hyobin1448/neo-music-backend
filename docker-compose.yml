# neo-music-backend · 로컬 개발용 PostgreSQL
#
#   기동:   docker compose up -d
#   종료:   docker compose down
#   초기화: docker compose down -v      (데이터 볼륨까지 삭제)
#
# 기동 후 postgres 프로필로 앱 실행:
#   ./gradlew bootRun --args='--spring.profiles.active=postgres'

services:
  postgres:
    image: postgres:16-alpine
    container_name: neomusic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: neomusic
      POSTGRES_USER: neomusic
      POSTGRES_PASSWORD: neomusic_local_dev
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
    ports:
      # 호스트 5433 → 컨테이너 5432. 다른 프로젝트가 쓰는 기본 5432 와 겹치지 않게.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neomusic -d neomusic"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
    driver: local
