spring:
  application:
    name: neo-music-backend

  # 개발/테스트용 인메모리 DB (실행 시 메모리에 뜨고, 종료 시 사라짐)
  datasource:
    url: jdbc:h2:mem:neomusic;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop          # 엔티티 기준으로 스키마 자동 생성 (개발 편의)
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # 브라우저에서 H2 콘솔로 데이터 확인 가능: http://localhost:8080/h2-console
  h2:
    console:
      enabled: true

# 인증(JWT) 설정 — 운영에서는 환경변수(NEOMUSIC_JWT_SECRET 등)로 반드시 덮어쓸 것
neomusic:
  jwt:
    secret: "dev-only-secret-please-change-in-production-0123456789"
    expiration-seconds: 86400   # 24시간

  # 최초 관리자 계정 — 서버 기동 시 없으면 자동 생성 (운영에서는 환경변수로 덮어쓸 것)
  admin:
    nickname: admin
    password: admin1234
    enabled: true

  # 파일 저장소 (로컬 파일시스템). 운영에선 S3 등으로 어댑터 교체
  storage:
    local:
      base-dir: ./storage
