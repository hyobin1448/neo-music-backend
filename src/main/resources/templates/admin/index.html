<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Neo Music 관리자</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0; background: #0f172a; color: #e2e8f0; }
        header { background: #1e293b; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
        header h1 { font-size: 18px; margin: 0; color: #f8fafc; }
        header .who { font-size: 13px; color: #94a3b8; }
        main { max-width: 900px; margin: 0 auto; padding: 24px; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 24px; margin-bottom: 20px; }
        h2 { font-size: 15px; margin: 0 0 16px; color: #cbd5e1; }
        label { display: block; font-size: 13px; margin: 10px 0 4px; color: #94a3b8; }
        input { width: 100%; padding: 10px 12px; border: 1px solid #334155; border-radius: 8px; background: #0f172a; color: #e2e8f0; font-size: 14px; }
        button { padding: 10px 18px; border: none; border-radius: 8px; background: #3b82f6; color: white; font-size: 14px; font-weight: 600; cursor: pointer; }
        button:hover { background: #2563eb; }
        button.ghost { background: transparent; border: 1px solid #475569; color: #cbd5e1; }
        button.danger { background: #ef4444; }
        button.danger:hover { background: #dc2626; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid #334155; }
        th { color: #94a3b8; font-weight: 500; font-size: 12px; }
        .muted { color: #64748b; font-size: 13px; }
        .msg { font-size: 13px; margin-top: 10px; min-height: 18px; }
        .msg.err { color: #f87171; }
        .msg.ok { color: #4ade80; }
        .hidden { display: none; }
        .row-actions { text-align: right; }
    </style>
</head>
<body>
<header>
    <h1>🎵 Neo Music 관리자</h1>
    <div>
        <span class="who" id="who"></span>
        <button class="ghost hidden" id="logoutBtn" onclick="logout()">로그아웃</button>
    </div>
</header>

<main>
    <!-- 로그인 -->
    <section class="card" id="loginCard">
        <h2>관리자 로그인</h2>
        <label>닉네임</label>
        <input id="nickname" value="admin"/>
        <label>비밀번호</label>
        <input id="password" type="password" value="admin1234"/>
        <div style="margin-top:16px"><button onclick="login()">로그인</button></div>
        <div class="msg err" id="loginMsg"></div>
    </section>

    <!-- 곡 추가 -->
    <section class="card hidden" id="addCard">
        <h2>곡 추가</h2>
        <label>곡 ID <span class="muted">(예: song_001)</span></label>
        <input id="newId"/>
        <label>제목</label>
        <input id="newTitle"/>
        <label>아티스트</label>
        <input id="newArtist"/>
        <label>오디오 파일 <span class="muted">(선택 — 올리면 트랙으로 등록)</span></label>
        <input id="newFile" type="file" accept="audio/*"/>
        <label>언어 코드 <span class="muted">(오디오 있을 때, 예: ko)</span></label>
        <input id="newLang" value="ko"/>
        <div style="margin-top:16px"><button onclick="addSong()" id="addBtn">등록</button></div>
        <div class="msg" id="addMsg"></div>
    </section>

    <!-- 곡 목록 -->
    <section class="card hidden" id="songsCard">
        <h2>곡 목록 <span class="muted" id="songCount"></span></h2>
        <table>
            <thead>
            <tr><th>ID</th><th>제목</th><th>아티스트</th><th>트랙</th><th></th></tr>
            </thead>
            <tbody id="songTable"></tbody>
        </table>
        <div class="msg" id="songsMsg"></div>
    </section>
</main>

<script>
    const tokenKey = 'neomusic_admin_token';
    const getToken = () => localStorage.getItem(tokenKey);
    const authHeader = () => ({ 'Authorization': 'Bearer ' + getToken() });

    async function login() {
        const nickname = document.getElementById('nickname').value;
        const password = document.getElementById('password').value;
        const msg = document.getElementById('loginMsg');
        msg.textContent = '';
        try {
            const res = await fetch('/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nickname, password })
            });
            if (!res.ok) { msg.textContent = '로그인 실패 (' + res.status + ')'; return; }
            const data = await res.json();
            if (data.role !== 'ADMIN') { msg.textContent = '관리자 계정이 아닙니다.'; return; }
            localStorage.setItem(tokenKey, data.accessToken);
            showAdmin(data.nickname);
        } catch (e) { msg.textContent = '오류: ' + e.message; }
    }

    function logout() {
        localStorage.removeItem(tokenKey);
        location.reload();
    }

    function showAdmin(nickname) {
        document.getElementById('loginCard').classList.add('hidden');
        document.getElementById('addCard').classList.remove('hidden');
        document.getElementById('songsCard').classList.remove('hidden');
        document.getElementById('logoutBtn').classList.remove('hidden');
        document.getElementById('who').textContent = nickname + ' (관리자)';
        loadSongs();
    }

    async function loadSongs() {
        const tbody = document.getElementById('songTable');
        const msg = document.getElementById('songsMsg');
        msg.textContent = '';
        try {
            const res = await fetch('/catalog');
            const data = await res.json();
            document.getElementById('songCount').textContent = '(' + data.changed.length + '곡)';
            tbody.innerHTML = '';
            if (data.changed.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="muted">등록된 곡이 없습니다.</td></tr>';
                return;
            }
            for (const s of data.changed) {
                const tr = document.createElement('tr');
                tr.innerHTML =
                    '<td class="muted">' + s.id + '</td>' +
                    '<td>' + escapeHtml(s.title) + '</td>' +
                    '<td>' + escapeHtml(s.artist) + '</td>' +
                    '<td class="muted">' + s.tracks.length + '개</td>' +
                    '<td class="row-actions"><button class="danger" data-id="' + s.id + '">삭제</button></td>';
                tr.querySelector('button').onclick = () => deleteSong(s.id);
                tbody.appendChild(tr);
            }
        } catch (e) { msg.textContent = '목록 로드 오류: ' + e.message; }
    }

    const val = (id) => document.getElementById(id).value.trim();

    async function addSong() {
        const id = val('newId'), title = val('newTitle'), artist = val('newArtist'), lang = val('newLang') || 'ko';
        const fileInput = document.getElementById('newFile');
        const msg = document.getElementById('addMsg'), btn = document.getElementById('addBtn');
        msg.className = 'msg';
        if (!id || !title || !artist) { msg.className = 'msg err'; msg.textContent = 'ID·제목·아티스트는 필수입니다.'; return; }
        btn.disabled = true;
        try {
            let tracks = [];
            if (fileInput.files.length > 0) {
                msg.textContent = '파일 업로드 중...';
                const fd = new FormData();
                fd.append('file', fileInput.files[0]);
                fd.append('prefix', 'songs');
                const up = await fetch('/admin/files', { method: 'POST', headers: authHeader(), body: fd });
                if (!up.ok) throw new Error('업로드 실패 (' + up.status + ')');
                const f = await up.json();
                tracks = [{ lang, label: lang, audioKey: f.key, durationMs: 0, bytes: f.bytes, checksum: f.checksum }];
            }
            msg.textContent = '등록 중...';
            const res = await fetch('/admin/songs', {
                method: 'POST',
                headers: { ...authHeader(), 'Content-Type': 'application/json' },
                body: JSON.stringify({ id, title, artist, tracks })
            });
            if (res.status === 409) throw new Error('이미 존재하는 곡 ID 입니다.');
            if (!res.ok) throw new Error('등록 실패 (' + res.status + ')');
            msg.className = 'msg ok'; msg.textContent = '✓ 등록 완료: ' + title;
            ['newId', 'newTitle', 'newArtist'].forEach(i => document.getElementById(i).value = '');
            fileInput.value = '';
            loadSongs();
        } catch (e) { msg.className = 'msg err'; msg.textContent = e.message; }
        finally { btn.disabled = false; }
    }

    async function deleteSong(id) {
        if (!confirm(id + ' 곡을 삭제할까요?')) return;
        const msg = document.getElementById('songsMsg');
        msg.className = 'msg';
        try {
            const res = await fetch('/admin/songs/' + encodeURIComponent(id), { method: 'DELETE', headers: authHeader() });
            if (!res.ok) throw new Error('삭제 실패 (' + res.status + ')');
            loadSongs();
        } catch (e) { msg.className = 'msg err'; msg.textContent = e.message; }
    }

    function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    // 이미 로그인 상태면 바로 관리자 화면
    if (getToken()) { showAdmin('관리자'); }
</script>
</body>
</html>
